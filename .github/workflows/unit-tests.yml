name: Unit tests

on:
  push:
    branches:
      - fix/rag-reliability-and-traceability
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pydantic>=2.7,<3" "pymupdf>=1.24,<2" "langchain-text-splitters>=0.3,<2"
      - name: Check Python syntax
        run: python -m compileall -q build_db.py ingest.py extract.py index_ids.py document_scope.py file_integrity.py schemas.py provenance.py tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
